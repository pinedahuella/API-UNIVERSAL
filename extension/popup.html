<!doctype html>
<meta charset="utf-8">
<style>
  body{width:300px;margin:0;padding:16px;font:14px "Segoe UI",system-ui,sans-serif;color:#12171f}
  .cab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .cab img{border-radius:8px;display:block}
  h1{font-size:15px;margin:0;letter-spacing:-.02em}
  h1 span{color:#5b6cff}
  p.intro{margin:0 0 14px;font-size:12px;color:#767d8f;line-height:1.5}
  label{display:block;font-size:11px;font-weight:700;color:#767d8f;margin-bottom:6px;
        text-transform:uppercase;letter-spacing:.05em}
  label b{font-weight:700;color:#aeb4c2;text-transform:none;letter-spacing:0}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #e2e5ee;
        border-radius:10px;font:inherit;margin-bottom:12px}
  input:focus{outline:0;border-color:#5b6cff;box-shadow:0 0 0 3px rgba(91,108,255,.14)}
  button{width:100%;padding:11px;border:0;border-radius:10px;background:#5b6cff;color:#fff;
         font:inherit;font-weight:600;cursor:pointer;margin-bottom:7px}
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:default}
  button.claro{background:#eef0f8;color:#3b4254}
  button.gris{background:transparent;color:#767d8f;border:1px solid #e2e5ee}
  .pie{font-size:11px;color:#aeb4c2;line-height:1.5;margin:10px 0 0}
  #msg{font-size:12px;color:#767d8f;line-height:1.45;margin:9px 0 0;min-height:16px}
  #msg.malo{color:#c0392b}
</style>
<div class="cab">
  <img src="iconos/icono48.png" alt="" width="34" height="34">
  <h1>API <span>UNIVERSAL</span></h1>
</div>
<p class="intro">Lee esta página y la vuelve a armar con un diseño propio.
   El sitio no se modifica: todo pasa en tu navegador.</p>

<label>¿De qué es la página? <b>— opcional</b></label>
<input id="tema" placeholder="lo leo de la página">

<button id="rearmar">Re-armar la página</button>
<button id="vestir" class="claro">Solo cambiarle el diseño</button>
<button id="quitar" class="gris">Dejarla como estaba</button>
<p id="msg"></p>
<p class="pie">Re-armar levanta una página nueva con el contenido de esta.
   Cambiar el diseño deja la página como está y solo la re-viste.</p>
<script src="popup.js"></script>
